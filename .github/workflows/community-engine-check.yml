name: Community engine checks

on:
  pull_request:
    paths:
      - 'web/engines/**'
      - 'tools/engine_catalogue.py'
      - 'tools/engine_kind_registry.json'
      - 'tools/cre3_check.py'
      - 'tools/abi3_usb_policy.json'
      - 'tools/dsp/abi3/**'
      - '.github/workflows/community-engine-check.yml'

permissions:
  contents: read

jobs:
  engine-files:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the trusted base checker
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false
      - name: Check out contribution files as data
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          persist-credentials: false
      - name: Validate local files and catalogue entries
        # No submitted build, DSP program, listing command or Python module runs.
        # Listing approval and hardware qualification remain maintainer work.
        run: >-
          python3 -I trusted/tools/engine_catalogue.py web/engines/index.json
          --repo-root candidate --base-dir trusted
